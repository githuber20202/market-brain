[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-brain-v4-brokerless"
version = "4.0.0"
description = "Broker-independent, event-sourced market decision operating system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "asyncpg>=0.30",
  "nats-py>=2.11",
  "httpx>=0.28",
  "websockets>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=0.25", "ruff>=0.12", "pyyaml>=6.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: requires TEST_POSTGRES_DSN and PostgreSQL"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

