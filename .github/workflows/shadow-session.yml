name: Shadow Session

# Runtime paused at the owner's request; research history is retained.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  gate:
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.gate.outputs.due }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: gate
        env:
          FORCE_GATE: ${{ inputs.force || 'false' }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
        run: |
          args=(--trigger "${{ github.event_name }}")
          if [[ "$FORCE_GATE" == "true" ]]; then args+=(--force); fi
          python scripts/session_gate.py "${args[@]}"

  wait:
    if: ${{ false }}
    needs: gate
    concurrency:
      group: market-brain-shadow-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market_batch
          POSTGRES_DB: market
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U market -d market"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_DSN: postgresql://market:market_batch@127.0.0.1:5432/market
      DATA_PLAN: keyless_delayed
      RUN_MODE: shadow
      EXECUTION_ACTIONS_ALLOWED: "false"
      DIRECT_ACCOUNT_ACCESS_ALLOWED: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e .
      - name: Restore once and run WAIT
        run: python -m market_brain.runtime.session --phase wait --budget-minutes 330

  phase_a:
    if: ${{ false }}
    needs: [gate, wait]
    concurrency:
      group: market-brain-shadow-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market_batch
          POSTGRES_DB: market
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U market -d market"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_DSN: postgresql://market:market_batch@127.0.0.1:5432/market
      DATA_PLAN: keyless_delayed
      RUN_MODE: shadow
      EXECUTION_ACTIONS_ALLOWED: "false"
      DIRECT_ACCOUNT_ACCESS_ALLOWED: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e .
      - name: Restore once and run phase A
        run: python -m market_brain.runtime.session --phase a --budget-minutes 330

  phase_b:
    if: ${{ false }}
    needs: [gate, phase_a]
    concurrency:
      group: market-brain-shadow-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 345
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market_batch
          POSTGRES_DB: market
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U market -d market"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      POSTGRES_DSN: postgresql://market:market_batch@127.0.0.1:5432/market
      DATA_PLAN: keyless_delayed
      RUN_MODE: shadow
      EXECUTION_ACTIONS_ALLOWED: "false"
      DIRECT_ACCOUNT_ACCESS_ALLOWED: "false"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install -e .
      - name: Restore once and run phase B
        run: python -m market_brain.runtime.session --phase b --budget-minutes 330
