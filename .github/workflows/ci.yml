name: CI

on:
  push:
    branches: [main, market-brain-v4]
  pull_request:
    branches: [main, market-brain-v4]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market_test
          POSTGRES_DB: market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U market -d market_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_POSTGRES_DSN: postgresql://market:market_test@127.0.0.1:5432/market_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: python -m pytest -q

      - name: Postgres tests
        run: |
          set -o pipefail
          python -m pytest -m postgres -q --strict-markers | tee /tmp/postgres-tests.log
          if grep -Eq "[0-9]+ skipped" /tmp/postgres-tests.log; then
            echo "Postgres marker suite skipped tests"
            exit 1
          fi

      - name: Runtime validation
        run: python scripts/validate_runtime.py

      - name: Replay smoke
        run: python scripts/replay_smoke.py --fixture tests/fixtures/replay_bars.json

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: ARM64 image build
        run: |
          docker buildx build --platform linux/arm64 --load --tag market-brain:ci-arm64 .
          echo "ARM64_IMAGE_BUILD=PASS"

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Docker Compose validation
        run: docker compose config -q

      - name: Compose smoke
        env:
          COMPOSE_SMOKE_PROJECT_NAME: market-brain-smoke-${{ github.run_id }}
          COMPOSE_SMOKE_PORT: "18080"
        run: ./scripts/compose_smoke.sh

      - name: Secret scan
        run: |
          rm -f .env
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              path for path in Path(".").rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and "egg-info" not in str(path)
              and "__pycache__" not in path.parts
          ]
          env_files = [str(path) for path in files if path.name == ".env"]
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b"),
          ]
          hits = [
              str(path) for path in files
              if any(pattern.search(path.read_text(errors="ignore")) for pattern in patterns)
          ]
          print(f"FILES_SCANNED={len(files)}")
          print(f"ENV_FILES={len(env_files)}")
          print(f"SECRET_MATCHES={len(hits)}")
          print("SECRET_SCAN=PASS" if not env_files and not hits else "SECRET_SCAN=FAIL")
          raise SystemExit(1 if env_files or hits else 0)
          PY
